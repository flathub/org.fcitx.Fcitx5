app-id: org.fcitx.Fcitx5
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
add-extensions:
  org.fcitx.Fcitx5.Addon:
    version: stable
    directory: addons
    subdirectories: true
    no-autodownload: true
    add-ld-path: lib
    autodelete: true
separate-locales: false
build-options:
  no-debuginfo: true
  strip: true
command: fcitx5
finish-args:
  - --socket=session-bus
  - --socket=x11
  - --share=ipc
  - --socket=wayland
  - --socket=inherit-wayland-socket
  - --share=network
  - --filesystem=xdg-config/kxkbrc:rw
  - --filesystem=xdg-config/fontconfig:ro
  - --filesystem=xdg-config/fcitx:create
  - --filesystem=xdg-config/ibus:create
  - --filesystem=xdg-cache/ibus:create
  - --device=dri
modules:
  - name: xcb-imdkit
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fcitx/xcb-imdkit
        tag: 1.0.9
        commit: 5a749718214ee2bcfec7751bd0087d101b9a7ab6
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
  - name: libuv
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/libuv/libuv/
        tag: v1.52.1
        x-checker-data:
          type: anitya
          project-id: 10784
          stable-only: true
          tag-template: v${version}
        commit: 1cfa32ff59c076ffb6ed735bbc8c18361558661f
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /lib/*.a
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DJSON_BuildTests=OFF
      - -DJSON_MultipleHeaders=ON
      - -DJSON_SystemInclude=ON
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/archive/v3.12.0.tar.gz
        sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187
        x-checker-data:
          type: anitya
          project-id: 11152
          stable-only: true
          url-template: https://github.com/nlohmann/json/archive/v${version}.tar.gz
  - name: enchant
    cleanup:
      - '*.a'
      - '*.la'
      - /bin
      - /include
    sources:
      - type: archive
        url: https://github.com/rrthomas/enchant/releases/download/v2.8.21/enchant-2.8.21.tar.gz
        sha256: dd2a762697c463148a8f59867089a5ebf2dd1449d869f93764b76c12bcf8acc0
        x-checker-data:
          type: anitya
          project-id: 6601
          url-template: https://github.com/rrthomas/enchant/releases/download/v$version/enchant-$version.tar.gz
  - name: fcitx5
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_SYSTEMD=Off
      - -DUSE_FLATPAK_ICON=On
      - -DENABLE_TEST=Off
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5
        tag: 5.1.22
        commit: 9dd4f34019f5b5ea3e576dfddd0eb3993cb17d7f
      - type: file
        url: https://download.fcitx-im.org/data/en_dict-20121020.tar.gz
        sha256: c44a5d7847925eea9e4d2d04748d442cd28dd9299a0b572ef7d91eac4f5a6ceb
        dest: src/modules/spell
      - type: file
        path: fcitx5.sh
    post-install:
      - install -d /app/addons
      - mv /app/bin/fcitx5{,-bin}
      - install -m755 fcitx5.sh /app/bin/fcitx5
  - name: fcitx5-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_QT4=Off
      - -DENABLE_QT5=Off
      - -DENABLE_QT6=On
      - -DCMAKE_INSTALL_QT6PLUGINDIR=/app/lib/plugins
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-qt
        tag: 5.1.15
        commit: d73fca6ef2dbd605da05dd4c1844e5bb2d91a5c5
  - name: fcitx5-configtool
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-configtool
        tag: 5.1.15
        commit: 9ae6d0503b3855dd8b31a1fbc121917b1921cf43
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_KCM=Off
  - name: fcitx5-all-icons
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-anthy
        dest: fcitx5-anthy
        tag: 5.1.11
        commit: 76262fffb04b36a628c931cb8cb2c272920be8bb
      - type: git
        url: https://github.com/fcitx/fcitx5-bamboo
        dest: fcitx5-bamboo
        tag: 1.0.11
        commit: 161ac10b1ff451525ca78fe523a599e5bbfff148
      - type: git
        url: https://github.com/fcitx/fcitx5-chewing
        dest: fcitx5-chewing
        tag: 5.1.13
        commit: 728e3f036447c52eaa6d819cefda814b275f949c
      - type: git
        url: https://github.com/fcitx/fcitx5-chinese-addons
        dest: fcitx5-chinese-addons
        tag: 5.1.14
        commit: 93b81c1b88973ffa0d8f9419861245643bbe8cad
      - type: git
        url: https://github.com/fcitx/fcitx5-hangul
        dest: fcitx5-hangul
        tag: 5.1.11
        commit: a9cd9daa71e7a9a36531bcbf73338aaa7227f448
      - type: git
        url: https://github.com/fcitx/fcitx5-kkc
        dest: fcitx5-kkc
        tag: 5.1.11
        commit: 0c8f4be55c027683381807ed6290aed4e3215ea0
      - type: git
        url: https://github.com/fcitx/fcitx5-rime
        dest: fcitx5-rime
        tag: 5.1.15
        commit: 16e95d94d5d1b390fc55ee14429b5ffa3a0902db
      - type: git
        url: https://github.com/fcitx/fcitx5-sayura
        dest: fcitx5-sayura
        tag: 5.1.7
        commit: 70fdadf994fb5130bad25e6ed63d5c38eb5c16bd
      - type: git
        url: https://github.com/fcitx/fcitx5-skk
        dest: fcitx5-skk
        tag: 5.1.11
        commit: 78bcf9c1d374d40ff9997e8630ea90f91c48ae78
      - type: git
        url: https://github.com/fcitx/fcitx5-table-extra
        dest: fcitx5-table-extra
        tag: 5.1.13
        commit: 7c6955478bf821f20a19a8d1aae6fd2f50ba8471
      - type: git
        url: https://github.com/fcitx/fcitx5-table-other
        dest: fcitx5-table-other
        tag: 5.1.8
        commit: 4db66ac484ebba76bd4c2cc03f80f92b35778d2f
      - type: git
        url: https://github.com/fcitx/fcitx5-unikey
        dest: fcitx5-unikey
        tag: 5.1.12
        commit: 304c1964552a01beb9fca1a55407fc091f14761c
      - type: git
        url: https://github.com/fcitx/fcitx5-zhuyin
        dest: fcitx5-zhuyin
        tag: 5.1.9
        commit: 18511eca982a9ee6b7e9f9bc8edb030660ee8d1e
      - type: git
        url: https://github.com/fcitx/mozc
        dest: mozc
        disable-submodules: true
        commit: 6b20c794f3112075703bae1603a81dce86b1f44e
      - type: git
        url: https://github.com/openvanilla/fcitx5-mcbopomofo
        tag: 3.1.1
        commit: a84bdd5c741e1696b270159ebda675946dc73d49
        x-checker-data:
          type: anitya
          project-id: 243006
          stable-only: true
          tag-template: ${version}
        dest: fcitx5-mcbopomofo
      - type: file
        path: install_icons
    build-commands:
      - ./install_icons
      - cd mozc/src && PREFIX=${FLATPAK_DEST} ../scripts/install_fcitx5_icons
